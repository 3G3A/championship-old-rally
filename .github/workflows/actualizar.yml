name: Actualizar Tiempos RSF

on:
  schedule:
    - cron: '0 */2 * * *' # Se ejecuta automáticamente cada 2 horas
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías y navegador Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium
        playwright install-deps chromium

    - name: Ejecutar script de actualización
      run: python actualizar_tiempos.py

    - name: Guardar y subir cambios
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resultados.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de tiempos RSF [skip ci]" && git push)
