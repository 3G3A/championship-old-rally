<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Old Rally</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab {
            background-color: #eab308;
            color: #000;
        }
        .active-subtab {
            background-color: #374151;
            color: #facc15;
            border-color: #eab308;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto">
        <!-- Cabecera -->
        <header class="text-center mb-6 border-b border-gray-800 pb-6">
            <h1 class="text-3xl md:text-5xl font-extrabold text-yellow-500 uppercase tracking-wider mb-2">
                Championship Old Rally
            </h1>
            <p class="text-gray-400 text-sm md:text-base">Tiempos y clasificaciones oficiales RBR RSF</p>
        </header>

        <!-- Imagen de la Placa del Rally -->
        <div id="contenedor-placa" class="flex justify-center mb-6 hidden">
            <img id="imagen-placa" src="" alt="Placa del Rally" class="max-h-48 md:max-h-64 object-contain drop-shadow-xl rounded-lg">
        </div>

        <!-- Botones de Pestañas Principales y Selector de Rally -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
            <div class="flex gap-3">
                <button id="btn-rally" onclick="cambiarPestana('rally')" 
                    class="active-tab px-6 py-2.5 rounded-lg font-bold transition-all shadow-md">
                    Rally
                </button>
                <button id="btn-general" onclick="cambiarPestana('general')" 
                    class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-6 py-2.5 rounded-lg font-bold transition-all shadow-md">
                    Clasificación General
                </button>
            </div>

            <!-- Selector para consultar rallies -->
            <div class="flex items-center gap-2">
                <label for="select-rally" class="text-sm font-semibold text-gray-300">Ver Rally:</label>
                <select id="select-rally" onchange="seleccionarRally(this.value)" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg p-2.5 focus:ring-yellow-500 focus:border-yellow-500 font-semibold">
                    <!-- Se llena automáticamente -->
                </select>
            </div>
        </div>

        <!-- TABLA: RESULTADOS DEL RALLY -->
        <div id="vista-rally" class="bg-gray-800 rounded-xl p-4 md:p-6 shadow-2xl border border-gray-700">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h2 id="titulo-rally" class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                    <span>🏁</span> Resultados del Rally
                </h2>

                <!-- Sub-Filtros de Categorías (GENERAL, 4WD, FWD, RWD) -->
                <div class="flex flex-wrap gap-2">
                    <button id="btn-cat-todas" onclick="filtrarCategoria('TODAS')" class="active-subtab border px-3 py-1 rounded-md text-xs font-bold transition-all">
                        GENERAL
                    </button>
                    <button id="btn-cat-4wd" onclick="filtrarCategoria('4WD')" class="bg-gray-700 hover:bg-gray-600 border border-transparent text-gray-300 px-3 py-1 rounded-md text-xs font-bold transition-all">
                        4WD
                    </button>
                    <button id="btn-cat-fwd" onclick="filtrarCategoria('FWD')" class="bg-gray-700 hover:bg-gray-600 border border-transparent text-gray-300 px-3 py-1 rounded-md text-xs font-bold transition-all">
                        FWD
                    </button>
                    <button id="btn-cat-rwd" onclick="filtrarCategoria('RWD')" class="bg-gray-700 hover:bg-gray-600 border border-transparent text-gray-300 px-3 py-1 rounded-md text-xs font-bold transition-all">
                        RWD
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-700 text-sm">
                            <th class="py-3 px-2 text-center">Pos</th>
                            <th class="py-3 px-4">Piloto</th>
                            <th class="py-3 px-4">Vehículo</th>
                            <th class="py-3 px-4 text-center">Cat.</th>
                            <th class="py-3 px-4 text-right">Tiempo Total</th>
                            <th class="py-3 px-4 text-center text-yellow-400">Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-rally-body" class="divide-y divide-gray-700/50">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">Cargando resultados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TABLA: CLASIFICACIÓN GENERAL -->
        <div id="vista-general" class="bg-gray-800 rounded-xl p-4 md:p-6 shadow-2xl border border-gray-700 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                    <span>🏆</span> Tabla General del Campeonato
                </h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-700 text-sm">
                            <th class="py-3 px-2 text-center">Pos</th>
                            <th class="py-3 px-4">Piloto</th>
                            <th class="py-3 px-4 text-center">Rallies Disputados</th>
                            <th class="py-3 px-4 text-center text-yellow-400">Puntos Totales</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-general-body" class="divide-y divide-gray-700/50">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-500">Aún no hay puntos acumulados en la general.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let configGlobal = null;
        let mapaCochesGlobal = { "4WD": [], "FWD": [], "RWD": [] };
        let datosRallyProcesados = [];
        let categoriaSeleccionada = 'TODAS';
        const puntosEscala = [50, 45, 42, 40, 38, 36, 34, 32, 30, 28, 26, 24, 22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2, 1];

        function cambiarPestana(vista) {
            const btnRally = document.getElementById('btn-rally');
            const btnGeneral = document.getElementById('btn-general');
            const vistaRally = document.getElementById('vista-rally');
            const vistaGeneral = document.getElementById('vista-general');

            if (vista === 'rally') {
                btnRally.className = 'active-tab px-6 py-2.5 rounded-lg font-bold transition-all shadow-md';
                btnGeneral.className = 'bg-gray-800 hover:bg-gray-700 text-gray-300 px-6 py-2.5 rounded-lg font-bold transition-all shadow-md';
                vistaRally.classList.remove('hidden');
                vistaGeneral.classList.add('hidden');
            } else {
                btnGeneral.className = 'active-tab px-6 py-2.5 rounded-lg font-bold transition-all shadow-md';
                btnRally.className = 'bg-gray-800 hover:bg-gray-700 text-gray-300 px-6 py-2.5 rounded-lg font-bold transition-all shadow-md';
                vistaGeneral.classList.remove('hidden');
                vistaRally.classList.add('hidden');
            }
        }

        // Cargar archivo config.json y coches.json
        Promise.all([
            fetch('config.json').then(res => res.json()).catch(() => ({ rallys: [] })),
            fetch('coches.json').then(res => res.json()).catch(() => ({ "4WD": [], "FWD": [], "RWD": [] }))
        ]).then(([cfg, coches]) => {
            configGlobal = cfg;
            mapaCochesGlobal = coches;

            const selector = document.getElementById('select-rally');
            selector.innerHTML = '';
            
            if (cfg.rallys && cfg.rallys.length > 0) {
                cfg.rallys.forEach((r, idx) => {
                    const option = document.createElement('option');
                    option.value = r.num || (idx + 1);
                    option.textContent = r.nombre + (r.activo ? ' (En curso)' : '');
                    if (r.activo) option.selected = true;
                    selector.appendChild(option);
                });

                const activo = cfg.rallys.find(r => r.activo) || cfg.rallys[0];
                cargarRallyDesdeCSV(activo);
            } else {
                // Si no hay config.json, intentar cargar directamente rally_1.csv
                cargarRallyDesdeCSV({ num: 1, nombre: 'Rally 1' });
            }
        });

        function seleccionarRally(num) {
            if (!configGlobal || !configGlobal.rallys) {
                cargarRallyDesdeCSV({ num: num, nombre: `Rally ${num}` });
                return;
            }
            const rallyEncontrado = configGlobal.rallys.find(r => (r.num == num));
            if (rallyEncontrado) {
                cargarRallyDesdeCSV(rallyEncontrado);
            } else {
                cargarRallyDesdeCSV({ num: num, nombre: `Rally ${num}` });
            }
        }

        async function cargarRallyDesdeCSV(rallyInfo) {
            // Actualizar placa y título
            const imgPlaca = document.getElementById('imagen-placa');
            if (rallyInfo.placa) {
                imgPlaca.src = rallyInfo.placa;
                document.getElementById('contenedor-placa').classList.remove('hidden');
            } else {
                document.getElementById('contenedor-placa').classList.add('hidden');
            }

            document.getElementById('titulo-rally').innerHTML = `<span>🏁</span> ${rallyInfo.nombre}`;

            const numRally = rallyInfo.num || 1;
            const tbodyRally = document.getElementById('tabla-rally-body');
            tbodyRally.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Cargando CSV de tiempos...</td></tr>';

            try {
                const resCsv = await fetch(`rally_${numRally}.csv`);
                if (!resCsv.ok) throw new Error("Archivo CSV no encontrado");

                const textoCsv = await resCsv.text();
                const lineas = textoCsv.split('\n').filter(l => l.trim() !== '');

                datosRallyProcesados = [];

                for (let i = 1; i < lineas.length; i++) {
                    const cols = lineas[i].split(',').map(c => c.replace(/"/g, '').trim());
                    if (cols.length < 7) continue;

                    const piloto = cols[2] || cols[3]; // user_name o real_name
                    const coche = cols[5];
                    const tiempo = cols[6]; // time3

                    if (!piloto || !tiempo || tiempo === '00:00.000') continue;

                    // Determinar Categoría según coches.json
                    let cat = '4WD';
                    if (mapaCochesGlobal.FWD && mapaCochesGlobal.FWD.includes(coche)) cat = 'FWD';
                    else if (mapaCochesGlobal.RWD && mapaCochesGlobal.RWD.includes(coche)) cat = 'RWD';
                    else if (mapaCochesGlobal['4WD'] && mapaCochesGlobal['4WD'].includes(coche)) cat = '4WD';

                    datosRallyProcesados.push({ piloto, coche, tiempo, categoria: cat });
                }

                filtrarCategoria(categoriaSeleccionada);

            } catch (err) {
                tbodyRally.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Este rally aún no se ha disputado o falta subir el archivo rally_' + numRally + '.csv</td></tr>';
            }
        }

        function filtrarCategoria(cat) {
            categoriaSeleccionada = cat;

            // Actualizar estilo de botones
            const btns = {
                'TODAS': 'btn-cat-todas',
                '4WD': 'btn-cat-4wd',
                'FWD': 'btn-cat-fwd',
                'RWD': 'btn-cat-rwd'
            };

            Object.keys(btns).forEach(key => {
                const el = document.getElementById(btns[key]);
                if (el) {
                    if (key === cat) {
                        el.className = 'active-subtab border px-3 py-1 rounded-md text-xs font-bold transition-all';
                    } else {
                        el.className = 'bg-gray-700 hover:bg-gray-600 border border-transparent text-gray-300 px-3 py-1 rounded-md text-xs font-bold transition-all';
                    }
                }
            });

            // Filtrar datos
            let listaFiltrada = datosRallyProcesados;
            if (cat !== 'TODAS') {
                listaFiltrada = datosRallyProcesados.filter(p => p.categoria === cat);
            }

            const tbodyRally = document.getElementById('tabla-rally-body');
            tbodyRally.innerHTML = '';

            if (listaFiltrada.length === 0) {
                tbodyRally.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">No hay pilotos registrados en esta categoría.</td></tr>';
                return;
            }

            listaFiltrada.forEach((p, index) => {
                const pos = index + 1;
                const pts = index < puntosEscala.length ? puntosEscala[index] : 1;

                const row = `
                    <tr class="hover:bg-gray-750 transition-colors border-b border-gray-700/30">
                        <td class="py-3 px-2 text-center font-bold ${pos <= 3 ? 'text-yellow-400' : 'text-gray-300'}">${pos}º</td>
                        <td class="py-3 px-4 font-semibold text-white">${p.piloto}</td>
                        <td class="py-3 px-4 text-sm text-gray-400">${p.coche}</td>
                        <td class="py-3 px-4 text-center text-xs"><span class="bg-gray-700 text-gray-300 px-2 py-0.5 rounded">${p.categoria}</span></td>
                        <td class="py-3 px-4 text-right font-mono text-gray-300">${p.tiempo}</td>
                        <td class="py-3 px-4 text-center font-bold text-yellow-400">${pts}</td>
                    </tr>
                `;
                tbodyRally.innerHTML += row;
            });
        }
    </script>
</body>
</html>
